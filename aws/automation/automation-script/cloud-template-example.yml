AWSTemplateFormatVersion: 2010-09-09
Description: >
  This template creates an Amazon EC2 instance. It installs and configures
  the Nginx web server via user data.

Parameters:
  AmazonLinuxAMIID:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-6.1-x86_64

Resources:
  WebServer:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: ami-0b20a6f09484773af
      InstanceType: t3.micro
      SecurityGroupIds:
        - sg-0150440963d5fdf39
      SubnetId: subnet-0a4e24ed69460c251
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          yum install -y nginx
          systemctl enable nginx
          systemctl start nginx

Outputs:
  Website:
    Description: URL to site
    Value: !Sub 'http://${WebServer.PublicIp}'
